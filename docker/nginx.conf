# Configuración de nginx para servir la versión web de PlantHaven.
#
# La app usa go_router con rutas por path (/login, /catalog, ...). Flutter web
# compila por defecto con estrategia de URL por hash (#/login), que no necesita
# reglas de servidor; el `try_files` deja el sitio preparado por si el equipo
# activa la estrategia por path en el futuro.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión: el bundle de Flutter es JS puro y pesa bastante.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/octet-stream image/svg+xml;

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # El service worker de Flutter (flutter_service_worker.js) no debe cachearse
    # para que el navegador detecte versiones nuevas de la app.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # index.html tampoco se cachea: es quien apunta al bundle versionado.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Los artefactos con hash en el nombre (main.dart.js, assets, fonts) sí
    # pueden cachearse para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
